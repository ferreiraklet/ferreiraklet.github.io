<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


  <style>
/* ===== Layout fix ===== */
#main-wrapper { margin-left: 0 !important; }
#topbar-wrapper { left: 0 !important; }

/* ===== NAVBAR ===== */
#main-nav {
  background: rgba(18,18,22,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(240,112,32,0.18);
  padding: 0.5rem 0;
  position: sticky; top: 0; z-index: 1000;
}
.navbar-brand { text-decoration: none !important; }
.nav-avatar {
  height: 36px; width: 36px; border-radius: 50%;
  border: 2px solid rgba(240,112,32,0.5);
  object-fit: cover; object-position: center 15%; flex-shrink: 0;
  transition: border-color 0.3s, transform 0.3s;
}
.navbar-brand:hover .nav-avatar { border-color: #ff8c3a; transform: scale(1.08); }
.nav-brand-name {
  font-size: 1.1rem; font-weight: 700; color: #fff;
  margin-left: 0.6rem;
  font-family: inherit;
}
#main-nav .nav-link {
  color: rgba(210,210,220,0.78) !important;
  font-size: 0.82rem; font-weight: 600;
  letter-spacing: 0.9px; text-transform: uppercase;
  padding: 0.55rem 1rem !important;
  position: relative; transition: color 0.22s;
}
#main-nav .nav-link::after {
  content: ''; position: absolute; bottom: 0;
  left: 0.5rem; right: 0.5rem; height: 2px;
  background: linear-gradient(90deg, #c85010, #ff8c3a);
  transform: scaleX(0); transition: transform 0.22s ease; border-radius: 2px;
}
#main-nav .nav-link:hover, #main-nav .nav-link.active { color: #fff !important; }
#main-nav .nav-link:hover::after, #main-nav .nav-link.active::after { transform: scaleX(1); }
@media (max-width: 991px) {
  #navbarNav {
    background: rgba(18,18,22,0.98);
    border-top: 1px solid rgba(240,112,32,0.2);
    border-radius: 0 0 8px 8px;
    padding: 0.3rem 0; margin-top: 0.3rem;
  }
  #main-nav .nav-link::after { display: none; }
  #main-nav .nav-link { padding: 0.7rem 1.5rem !important; border-left: 3px solid transparent; border-radius: 0; }
  #main-nav .nav-link.active, #main-nav .nav-link:hover {
    border-left-color: #f07020 !important;
    background: rgba(240,112,32,0.1); color: #fff !important;
  }
}

/* ===== PARTICLE CANVAS (full page, fixed) ===== */
#particle-canvas {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none; z-index: 0;
}

/* ===== HERO SECTION ===== */
.hero-section {
  position: relative;
  padding: 3rem 1.5rem 2rem; min-height: 430px;
  display: flex; align-items: center;
}
.hero-inner {
  position: relative; z-index: 1;
  display: flex; justify-content: center; align-items: center;
  gap: 2rem; flex-wrap: nowrap; width: 100%;
}

/* ---- PROFILE SPOTLIGHT ---- */
.hero-inner { align-items: center; }
.profile-col {
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0; width: 195px; min-width: 195px;
}
.profile-avatar-wrap {
  position: relative; width: 130px; height: 130px;
  margin-bottom: 1.1rem;
}
.profile-avatar {
  width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
  object-position: center 15%;
  position: relative; z-index: 2; display: block;
  border: 3px solid rgba(240,112,32,0.55);
}
.profile-ring {
  position: absolute; border-radius: 50%; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(240,112,32,0.22);
  animation: ring-pulse 3s ease-in-out infinite;
}
.profile-ring-1 { width: 152px; height: 152px; animation-delay: 0s; }
.profile-ring-2 { width: 176px; height: 176px; animation-delay: 0.9s; border-color: rgba(240,112,32,0.1); }
@keyframes ring-pulse {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
  50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.04); }
}
.profile-status-dot {
  position: absolute; bottom: 8px; right: 8px; z-index: 3;
  width: 14px; height: 14px; border-radius: 50%;
  background: #22c55e; border: 2px solid rgba(18,18,22,0.95);
  box-shadow: 0 0 8px rgba(34,197,94,0.6);
}
.profile-name {
  font-size: 1.5rem; font-weight: 800; color: #fff; margin: 0 0 0.15rem;
  font-family: inherit;
  text-align: center;
}
.profile-handle {
  font-size: 0.78rem; color: #f07020; font-family: 'Courier New', monospace;
  margin-bottom: 0.7rem; text-align: center;
}
.profile-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center; margin-bottom: 1rem; }
.profile-tag {
  background: rgba(240,112,32,0.08); border: 1px solid rgba(240,112,32,0.22);
  border-radius: 20px; padding: 3px 10px;
  font-size: 0.68rem; color: rgba(210,180,150,0.85); font-weight: 600;
  display: inline-flex; align-items: center; gap: 0.3rem;
}
.profile-tag i { color: #f07020; font-size: 0.6rem; }
.profile-social { display: flex; gap: 0.45rem; flex-wrap: wrap; justify-content: center; }
.psoc {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(240,112,32,0.07); color: rgba(195,195,210,0.6) !important;
  border: 1px solid rgba(240,112,32,0.16); font-size: 0.75rem;
  transition: all 0.2s; text-decoration: none !important;
}
.psoc:hover { background: rgba(240,112,32,0.2); color: #fff !important; border-color: #f07020; transform: translateY(-2px); }

/* ---- Hero right text ---- */
.hero-text-side { flex: 1; min-width: 0; max-width: 420px; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px;
  color: #f07020; font-weight: 700; margin-bottom: 0.7rem;
}
.hero-eyebrow-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #f07020;
  box-shadow: 0 0 8px #f07020; flex-shrink: 0;
  animation: dot-blink 2s ease-in-out infinite;
}
@keyframes dot-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.hero-headline {
  font-size: 2.3rem; font-weight: 800; color: #fff; line-height: 1.18; margin-bottom: 1rem;
  font-family: inherit;
}
.hero-headline .hl { color: #f07020; }
.hero-body-text { color: rgba(192,192,208,0.8); font-size: 0.93rem; line-height: 1.75; margin-bottom: 1.2rem; }
.hero-divider { height: 1px; background: linear-gradient(90deg, rgba(240,112,32,0.35), transparent); margin-bottom: 1.1rem; }
.hero-quick-stats { display: flex; align-items: center; gap: 0; margin-bottom: 1.5rem; }
.hqs-item { text-align: center; padding: 0 1.2rem; }
.hqs-item:first-child { padding-left: 0; }
.hqs-val { display: block; font-size: 1.15rem; font-weight: 700; color: #f07020; line-height: 1.1; }
.hqs-lbl { display: block; font-size: 0.62rem; color: rgba(160,160,180,0.6); text-transform: uppercase; letter-spacing: 0.7px; margin-top: 2px; }
.hqs-sep { width: 1px; height: 28px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
.hero-cta-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.btn-primary-orange {
  background: linear-gradient(135deg, #c85010, #f07020);
  color: #fff !important; border: none; padding: 0.6rem 1.5rem;
  border-radius: 6px; font-size: 0.88rem; font-weight: 600;
  text-decoration: none !important; transition: all 0.22s;
  display: inline-flex; align-items: center; gap: 0.4rem;
  box-shadow: 0 4px 15px rgba(240,112,32,0.3);
}
.btn-primary-orange:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(240,112,32,0.45); }
.btn-ghost-orange {
  background: transparent; color: #f07020 !important;
  border: 1px solid rgba(240,112,32,0.55); padding: 0.6rem 1.5rem;
  border-radius: 6px; font-size: 0.88rem; font-weight: 600;
  text-decoration: none !important; transition: all 0.22s;
  display: inline-flex; align-items: center; gap: 0.4rem;
}
.btn-ghost-orange:hover { background: rgba(240,112,32,0.1); border-color: #f07020; transform: translateY(-2px); }

@media (max-width: 768px) {
  .hero-section { padding: 2.5rem 1rem 1.5rem; min-height: 0; }
  .hero-inner { gap: 2rem; flex-direction: column; align-items: center; }
  .profile-col { width: 100%; }
  .hero-text-side { text-align: center; }
  .hero-cta-row { justify-content: center; }
  .hero-quick-stats { justify-content: center; }
  .hero-headline { font-size: 1.75rem; }
  .hero-divider { display: none; }
}

/* ===== STATS BAR ===== */
.stats-bar {
  display: flex; flex-wrap: wrap; justify-content: center;
  margin: 0 1.5rem 2rem;
  background: rgba(32,32,40,0.65); border: 1px solid rgba(240,112,32,0.14);
  border-radius: 10px; padding: 1rem 0.5rem;
  position: relative; z-index: 1;
}
.stat-item { flex: 1; min-width: 110px; text-align: center; padding: 0.4rem 0.8rem; border-right: 1px solid rgba(255,255,255,0.06); }
.stat-item:last-child { border-right: none; }
.stat-num { display: block; font-size: 1.4rem; font-weight: 700; color: #f07020; line-height: 1.2; }
.stat-label { display: block; font-size: 0.7rem; color: rgba(170,170,185,0.6); text-transform: uppercase; letter-spacing: 0.7px; margin-top: 0.15rem; }
@media (max-width: 768px) {
  .stats-bar { margin: 0 0.5rem 1.5rem; }
  .stat-item { min-width: 80px; }
  .stat-num { font-size: 1.1rem; }
}

/* ===== BUG BOUNTY CARDS ===== */
.purple-background { padding: 20px; margin-bottom: 20px; }
.info {
  text-align: center; margin-bottom: 15px;
  background-color: rgba(55,55,65,0.35) !important;
  padding: 20px; transition: transform 0.22s, background-color 0.22s, box-shadow 0.22s;
  border-radius: 8px; border: 1px solid rgba(240,112,32,0.1);
}
.info:hover { transform: translateY(-4px); background-color: rgba(240,112,32,0.1) !important; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.info img { width: 50px; height: auto; margin: 0 auto 8px; }
.company-name { font-size: 1rem; color: #ffb070; font-weight: 600; }
.description { font-size: 0.82rem; color: #bbb; }

/* Hide auto-generated dynamic title (pages have their own section headers) */
#page h1.dynamic-title { display: none; }
#page h1.dynamic-title ~ .post-content { margin-top: 0.5rem; }

/* ===== HACKING PAGE ===== */
.hacking-section-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.5rem; padding-bottom: 0.75rem;
  border-bottom: 1px solid rgba(240,112,32,0.15);
}
.hacking-section-header h1 { font-size: 1.1rem; font-weight: 700; color: #fff; margin: 0; }
.hacking-header-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(240,112,32,0.35), transparent); }
.post-count-badge {
  font-size: 0.7rem; background: rgba(240,112,32,0.12);
  border: 1px solid rgba(240,112,32,0.25); color: #f07020;
  border-radius: 12px; padding: 2px 10px; font-weight: 600;
}
.post-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 1.2rem; }
.post-card {
  background: rgba(25,25,32,0.85); border: 1px solid rgba(240,112,32,0.1);
  border-radius: 10px; overflow: hidden; cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
  position: relative; display: flex; flex-direction: column;
  text-decoration: none !important;
}
.post-card:hover { transform: translateY(-5px); box-shadow: 0 14px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(240,112,32,0.22); border-color: rgba(240,112,32,0.28); }
.post-card-img-wrap { position: relative; height: 155px; overflow: hidden; flex-shrink: 0; }
.post-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s; display: block; }
.post-card:hover .post-card-img-wrap img { transform: scale(1.07); }
.post-card-img-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 55%; background: linear-gradient(to top, rgba(22,22,28,1), transparent); pointer-events: none; }
.post-card-content { padding: 0.85rem 1rem 0.5rem; flex: 1; }
.post-card-cat { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1.5px; color: #f07020; font-weight: 700; margin-bottom: 0.35rem; }
.post-card-title { font-size: 0.95rem; font-weight: 700; color: #fff; line-height: 1.35; margin: 0 0 0.45rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-card-excerpt { font-size: 0.78rem; color: rgba(170,170,190,0.7); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-card-footer { padding: 0.6rem 1rem 0.75rem; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto; }
.post-card-date { font-size: 0.68rem; color: rgba(155,155,170,0.55); display: flex; align-items: center; gap: 0.3rem; }
.post-card-arrow {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(240,112,32,0.1); border: 1px solid rgba(240,112,32,0.22);
  display: inline-flex; align-items: center; justify-content: center;
  color: #f07020 !important; font-size: 0.75rem;
  text-decoration: none !important; transition: all 0.2s; flex-shrink: 0;
}
.post-card:hover .post-card-arrow { background: #f07020; color: #fff !important; transform: translateX(2px); }
.post-card-no-image { padding-top: 1.2rem; }

/* ===== TABLE OF CONTENTS (panel) ===== */
#panel-wrapper { color: rgba(180,180,200,0.75); }
#toc-wrapper {
  border-left: 2px solid rgba(240,112,32,0.2);
  padding-left: 0.75rem !important;
  margin-top: 1.5rem;
}
#toc-wrapper > h3 {
  font-size: 0.68rem !important; font-weight: 700 !important;
  text-transform: uppercase; letter-spacing: 2px;
  color: #f07020 !important; margin-bottom: 0.75rem !important;
  padding-left: 0 !important; padding-top: 0 !important;
  display: flex; align-items: center; gap: 0.4rem;
}
#toc-wrapper > h3::before {
  content: ''; display: inline-block; width: 14px; height: 2px;
  background: linear-gradient(90deg, #c85010, #f07020);
  border-radius: 2px; flex-shrink: 0;
}
#toc { padding-left: 0; }
#toc .nav { flex-direction: column; flex-wrap: nowrap; padding-left: 0; }
#toc .nav-link {
  font-size: 0.75rem !important; line-height: 1.4;
  color: rgba(175,175,195,0.65) !important;
  padding: 0.22rem 0 !important; white-space: normal;
  border-left: 2px solid transparent; padding-left: 0.6rem !important;
  transition: color 0.18s, border-color 0.18s;
  text-decoration: none !important;
}
#toc .nav-link:hover {
  color: rgba(240,160,80,0.9) !important;
  border-left-color: rgba(240,112,32,0.35) !important;
}
#toc .nav-link.active {
  color: #f07020 !important;
  border-left-color: #f07020 !important;
  font-weight: 600;
}
#toc .nav .nav { padding-left: 0.8rem; }
#toc .nav .nav .nav-link { font-size: 0.7rem !important; color: rgba(155,155,175,0.55) !important; }
#toc .nav .nav .nav-link.active { color: #ff8c3a !important; border-left-color: rgba(240,112,32,0.6) !important; }
  </style>
